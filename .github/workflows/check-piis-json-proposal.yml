name: PIIS JSON 0.1 structural checks

on:
  push:
    branches: [main]
    paths:
      - "proposals/json-pfd-0.1/**"
      - "samples/clinical-dft-draft01/**"
      - "samples/tax-documents-draft01/**"
      - ".github/workflows/check-piis-json-proposal.yml"
  pull_request:
    paths:
      - "proposals/json-pfd-0.1/**"
      - "samples/clinical-dft-draft01/**"
      - "samples/tax-documents-draft01/**"
      - ".github/workflows/check-piis-json-proposal.yml"

permissions:
  contents: read

jobs:
  json-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Validate PIIS examples against exploratory schema
        run: python proposals/json-pfd-0.1/validate_samples.py
